<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Sklep Minecraft - OGHUB Style</title>
    <style>
        :root {
            --bg-dark: #0b0e14;
            --card-bg: #131722;
            --accent-blue: #00f2fe;
            --accent-green: #00ff88;
            --text-muted: #8f9bba;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* --- SEKCJA OSTATNICH ZAKUPÓW (PRZEWIJANIE OD PRAWEJ DO LEWEJ) --- */
        .recent-purchases-container {
            width: 100%;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid #232938;
            border-radius: 12px;
            padding: 15px 0;
            position: relative;
            margin-bottom: 40px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .ticker-wrapper {
            display: flex;
            width: max-content;
            animation: scrollLeft 25s linear infinite;
        }

        .ticker-wrapper:hover {
            animation-play-state: paused; /* Zatrzymaj po najechaniu myszką */
        }

        @keyframes scrollLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .purchase-card {
            min-width: 160px;
            background: #1a1f2c;
            border: 1px solid #2d3548;
            border-radius: 10px;
            padding: 12px;
            margin: 0 10px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .purchase-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
        }

        .purchase-card img {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            background: #0f121a;
            border: 1px solid #3a445d;
            margin-bottom: 8px;
        }

        .player-name {
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-name {
            font-size: 12px;
            color: var(--accent-blue);
            margin: 4px 0;
            font-weight: 600;
        }

        .price-tag {
            font-size: 12px;
            color: var(--accent-green);
            font-weight: bold;
            background: rgba(0, 255, 136, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        /* --- SEKCJA TOP 1 / TOP 2 / TOP 3 (KASA) --- */
        .section-title {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-align: center;
        }

        .top-donators-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .top-card {
            background: linear-gradient(145deg, #181d2a 0%, #11141d 100%);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            position: relative;
            border: 1px solid #2a3142;
            transition: transform 0.3s;
        }

        .top-card:hover {
            transform: translateY(-5px);
        }

        /* TOP 1 - Środek wyróżniony */
        .top-card.top-1 {
            order: 2;
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            transform: scale(1.05);
        }
        .top-card.top-2 { order: 1; border: 2px solid #c0c0c0; }
        .top-card.top-3 { order: 3; border: 2px solid #cd7f32; }

        .rank-badge {
            font-size: 12px;
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .top-1 .rank-badge { background: #ffd700; color: #000; }
        .top-2 .rank-badge { background: #c0c0c0; color: #000; }
        .top-3 .rank-badge { background: #cd7f32; color: #fff; }

        .top-avatar {
            width: 80px;
            height: 80px;
            margin: 0 auto 10px;
        }

        .top-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .top-username {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }

        .top-amount {
            font-size: 14px;
            color: var(--accent-green);
            font-weight: bold;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <!-- OSTATNIE ZAKUPY -->
    <div class="section-title">Ostatnie Zakupy</div>
    <div class="recent-purchases-container">
        <div class="ticker-wrapper" id="purchases-ticker">
            <!-- Zakupy ładowane dynamicznie z ViShop API -->
        </div>
    </div>

    <!-- TOP 3 WYDANEJ KASY -->
    <div class="section-title">Top Wspierający</div>
    <div class="top-donators-grid" id="top-donators">
        <!-- TOP 1, TOP 2, TOP 3 ładowane dynamicznie z ViShop API -->
    </div>

    <script>
        // TE SKINY BĘDĄ UŻYWANE JAKO FALLBACK
        const FALLBACK_SKIN_HASH = "d999297e634bcc3d"; 
        
        // KONFIGURACJA VISHOP API
        // Zastąp poniższy URL swoim adresem ze sklepu ViShop
        const VISHOP_API_URL = "https://twojsklep.vishop.pl/api";

        function getSkinUrl(username) {
            if (!username || username === "" || username.toLowerCase() === "steve") {
                return `https://mc-heads.net/avatar/${FALLBACK_SKIN_HASH}/64.png`;
            }
            return `https://mc-heads.net/avatar/${encodeURIComponent(username)}/64.png`;
        }

        function handleSkinError(img) {
            img.onerror = null;
            img.src = `https://mc-heads.net/avatar/${FALLBACK_SKIN_HASH}/64.png`;
        }

        // 1. ŁADOWANIE OSTATNICH ZAKUPÓW Z VISHOP
        async function loadLastPurchases() {
            const container = document.getElementById('purchases-ticker');
            
            try {
                const res = await fetch(`${VISHOP_API_URL}/payments/v2/last`);
                const data = await res.json();
                
                // Tworzymy elementy
                let itemsHtml = '';
                data.forEach(item => {
                    const skin = getSkinUrl(item.username);
                    itemsHtml += `
                        <div class="purchase-card">
                            <img src="${skin}" onerror="handleSkinError(this)" alt="${item.username}">
                            <div class="player-name">${item.username || 'Gracz'}</div>
                            <div class="item-name">${item.service_name || 'Zakup'}</div>
                            <div class="price-tag">${item.cost || '0.00'} PLN</div>
                        </div>
                    `;
                });

                // Duplikujemy zawartość (2x), aby uzyskać płynną, nieskończoną animację pętli
                container.innerHTML = itemsHtml + itemsHtml;

            } catch (err) {
                console.error("Błąd ładowania zakupów ViShop:", err);
                // Domyślne zapasowe dane testowe, jeśli API nie odpowiada
                renderFallbackPurchases(container);
            }
        }

        // 2. ŁADOWANIE TOP 3 WYDANEJ KASY
        async function loadTopDonators() {
            const container = document.getElementById('top-donators');

            try {
                const res = await fetch(`${VISHOP_API_URL}/payments/v2/top`);
                const data = await res.json(); // Oczekiwane 3 rekordy

                container.innerHTML = `
                    <div class="top-card top-2">
                        <div class="rank-badge">TOP 2</div>
                        <div class="top-avatar">
                            <img src="${getSkinUrl(data[1]?.username)}" onerror="handleSkinError(this)">
                        </div>
                        <div class="top-username">${data[1]?.username || 'Brak'}</div>
                        <div class="top-amount">${data[1]?.total || '0.00'} PLN</div>
                    </div>
                    <div class="top-card top-1">
                        <div class="rank-badge">TOP 1</div>
                        <div class="top-avatar">
                            <img src="${getSkinUrl(data[0]?.username)}" onerror="handleSkinError(this)">
                        </div>
                        <div class="top-username">${data[0]?.username || 'Brak'}</div>
                        <div class="top-amount">${data[0]?.total || '0.00'} PLN</div>
                    </div>
                    <div class="top-card top-3">
                        <div class="rank-badge">TOP 3</div>
                        <div class="top-avatar">
                            <img src="${getSkinUrl(data[2]?.username)}" onerror="handleSkinError(this)">
                        </div>
                        <div class="top-username">${data[2]?.username || 'Brak'}</div>
                        <div class="top-amount">${data[2]?.total || '0.00'} PLN</div>
                    </div>
                `;
            } catch (err) {
                console.error("Błąd ładowania Top Donators:", err);
            }
        }

        function renderFallbackPurchases(container) {
            const mockData = [
                { username: 'Notch', service_name: 'VIP', cost: '19.99' },
                { username: '', service_name: 'Klucz Skrzyni', cost: '4.99' },
                { username: 'Jeb_', service_name: 'SVIP', cost: '39.99' }
            ];
            let html = mockData.map(item => `
                <div class="purchase-card">
                    <img src="${getSkinUrl(item.username)}" onerror="handleSkinError(this)">
                    <div class="player-name">${item.username || 'Brak Nicku'}</div>
                    <div class="item-name">${item.service_name}</div>
                    <div class="price-tag">${item.cost} PLN</div>
                </div>
            `).join('');
            container.innerHTML = html + html;
        }

        // Inicjalizacja pobierania przy załadowaniu strony
        document.addEventListener('DOMContentLoaded', () => {
            loadLastPurchases();
            loadTopDonators();
        });
    </script>
</body>
</html>
